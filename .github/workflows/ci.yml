name: Checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      AUTOIP_ADMIN_PASSWORD: testing-only-password-123
      AUTOIP_DATABASE_URL: sqlite:///./autoip-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r commander/requirements.txt -r agent/requirements.txt pytest
      - run: python -m compileall -q commander agent
      - run: python -m pytest -q
