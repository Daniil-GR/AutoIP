# Dedicated AutoIP vhost. Review before installing; no existing site is modified.
server {
    listen 80;
    listen [::]:80;
    server_name admin.vetka.rest;
    client_max_body_size 64k;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/autoip/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://admin.vetka.rest$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.vetka.rest;
    ssl_certificate /etc/letsencrypt/live/admin.vetka.rest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.vetka.rest/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
