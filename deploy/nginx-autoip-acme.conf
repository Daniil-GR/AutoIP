# Bootstrap ONLY for certificate issuance, before the HTTPS configuration.
server {
    listen 80;
    listen [::]:80;
    server_name admin.vetka.rest;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/autoip/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
